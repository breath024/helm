<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>HELM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c98f5a' stroke-width='1.6' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='6.6'/%3E%3Ccircle cx='12' cy='12' r='2.3'/%3E%3Cpath d='M14.6 12H21.6M9.4 12H2.4M12 14.6V21.6M12 9.4V2.4M13.84 13.84 18.79 18.79M10.16 10.16 5.21 5.21M13.84 10.16 18.79 5.21M10.16 13.84 5.21 18.79'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/vendor/cm/codemirror.css">
<link rel="stylesheet" href="/static/vendor/cm/material-darker.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="app">

  <aside id="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="6.6"/>
        <circle cx="12" cy="12" r="2.3"/>
        <path d="M14.6 12H21.6M9.4 12H2.4M12 14.6V21.6M12 9.4V2.4M13.84 13.84 18.79 18.79M10.16 10.16 5.21 5.21M13.84 10.16 18.79 5.21M10.16 13.84 5.21 18.79"/>
      </svg>
      <span class="wordmark">HELM</span>
    </div>

    <div class="block">
      <label class="lbl">폴더</label>
      <select id="proj"></select>
      <label class="lbl">모델</label>
      <select id="modelPick"></select>
      <label class="lbl" id="effortLbl">강도</label>
      <div id="effortPick" class="seg tiny"></div>
      <label class="lbl">권한 모드</label>
      <select id="permPick"></select>
      <div id="permNote" class="note"></div>
      <button id="newBtn" class="primary">새 세션 시작</button>
      <button id="codeBtn" class="secondary">코드 편집기 열기</button>
    </div>

    <div class="block grow">
      <div class="lbl row">
        <span>최근 작업</span>
        <button id="reloadBtn" class="ghost" title="새로고침">↻</button>
      </div>
      <input id="filter" class="filter" placeholder="검색…">
      <div id="sessions" class="list"></div>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div id="tabs"></div>
      <div class="spacer"></div>
      <div id="limits" class="limits hidden" title="구독 한도"></div>
      <div id="usage" class="usage hidden" title="이 세션이 물고 있는 컨텍스트">
        <div class="ubar"><i></i></div>
        <span class="utext"></span>
      </div>
      <select id="paneModel" class="mini hidden" title="이 세션의 모델 변경"></select>
      <div id="paneEffort" class="seg small hidden" title="이 세션의 강도 변경"></div>
      <div id="layoutPick" class="seg small">
        <button data-n="1" class="on">▉</button>
        <button data-n="2">▍▍</button>
        <button data-n="3">▍▍▍</button>
        <button data-n="4">▟</button>
      </div>
    </div>
    <div id="grid" class="n1"></div>
  </main>

</div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/addon-webgl.js"></script>
<script src="/static/vendor/cm/codemirror.js"></script>
<script src="/static/vendor/cm/mode-python.js"></script>
<script src="/static/vendor/cm/mode-javascript.js"></script>
<script src="/static/vendor/cm/mode-clike.js"></script>
<script src="/static/vendor/cm/mode-xml.js"></script>
<script src="/static/vendor/cm/mode-css.js"></script>
<script src="/static/vendor/cm/mode-htmlmixed.js"></script>
<script src="/static/vendor/cm/mode-markdown.js"></script>
<script src="/static/vendor/cm/mode-shell.js"></script>
<script src="/static/vendor/cm/addon-closebrackets.js"></script>
<script src="/static/vendor/cm/addon-matchbrackets.js"></script>
<script src="/static/vendor/cm/addon-active-line.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
